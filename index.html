<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rider ID Generator</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="/api/config"></script>

<style>
:root {
  color-scheme: dark;
  font-family: Arial, sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #111;
  color: #fff;
  display: flex;
  gap: 20px;
  padding: 20px;
  align-items: flex-start;
}

.controls {
  width: 340px;
  flex: 0 0 340px;
  background: #1e1e1e;
  padding: 18px;
  border-radius: 12px;
  box-shadow: 0 8px 30px rgba(0,0,0,.28);
}

.controls h3 { margin: 0 0 14px; }
.controls label {
  display: block;
  margin: 12px 0 6px;
  font-weight: 700;
}
.controls input,
.controls select,
.controls button {
  width: 100%;
  padding: 10px;
  border-radius: 7px;
  border: 1px solid #444;
  font-size: 14px;
}
.controls input,
.controls select {
  background: #111;
  color: #fff;
}
.controls button {
  margin-top: 10px;
  cursor: pointer;
  font-weight: 700;
  border: 0;
}
.controls button.primary { background: #d4af37; color: #111; }
.controls button.secondary { background: #333; color: #fff; }
.controls button:disabled { opacity: .45; cursor: not-allowed; }

.limit-box {
  padding: 11px 12px;
  border: 1px solid #4a4a4a;
  border-radius: 8px;
  background: #171717;
  margin-bottom: 12px;
  line-height: 1.4;
}
.limit-box strong { color: #e5c14e; }
.limit-box.limit-reached { border-color: #b91c1c; background: #2b1212; }

.message {
  min-height: 20px;
  margin-top: 10px;
  font-size: 13px;
  line-height: 1.4;
}
.message.error { color: #fca5a5; }
.message.success { color: #86efac; }

.preview-stage {
  overflow: auto;
  max-width: calc(100vw - 400px);
  padding-bottom: 10px;
}

.card-wrapper {
  display: flex;
  flex-direction: column;
  gap: 20px;
  min-width: 1011px;
}

.id-card {
  position: relative;
  width: 1011px;
  height: 638px;
  background: #fff;
  overflow: hidden;
}
.id-card img.bg { width: 100%; height: 100%; display: block; }

/* The photo area has been removed. Rider information now occupies the card clearly. */
.rider-id {
  position: absolute;
  left: 92px;
  top: 330px;
  font-size: 32px;
  font-weight: 800;
  color: #111;
  letter-spacing: 1px;
}
.name {
  position: absolute;
  left: 92px;
  top: 395px;
  width: 820px;
  font-size: 58px;
  line-height: 1.05;
  font-weight: 800;
  color: #000;
  text-transform: uppercase;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.workplace {
  position: absolute;
  left: 92px;
  top: 486px;
  font-size: 31px;
  font-weight: 700;
  color: #a88718;
}

@media (max-width: 900px) {
  body { flex-direction: column; padding: 12px; }
  .controls { width: 100%; flex-basis: auto; }
  .preview-stage { max-width: 100%; width: 100%; }
}
</style>
</head>
<body>

<div class="controls">
  <h3>Rider ID Editor</h3>

  <div class="limit-box" id="limitBox">
    Weekly usage: <strong><span id="usedCount">0</span>/15</strong><br>
    Remaining this week: <strong id="remainingCount">15</strong>
  </div>

  <label for="clientSelect">Rider Workplace</label>
  <select id="clientSelect" onchange="updatePreview()">
    <option value="MG">M-Gas</option>
    <option value="EG">EasyGas</option>
  </select>

  <label for="riderNumber">Rider ID Number</label>
  <input id="riderNumber" placeholder="e.g. 1023" maxlength="20" oninput="updatePreview()">

  <label for="riderName">Rider Name</label>
  <input id="riderName" placeholder="e.g. John Kamau" maxlength="50" oninput="updatePreview()">

  <button class="primary download-button" onclick="downloadPNG('frontID', 'Front')">Download Front (PNG)</button>
  <button class="secondary download-button" onclick="downloadPNG('backID', 'Back')">Download Back (PNG)</button>
  <button class="secondary download-button" onclick="downloadPDF()">Download PDF (Front + Back)</button>
  <button class="secondary" onclick="nextRider()">Next Rider</button>

  <div id="message" class="message" aria-live="polite"></div>
</div>

<div class="preview-stage">
  <div class="card-wrapper">
    <div class="id-card" id="frontID">
      <img src="Horizontal ID.jpg" class="bg" alt="Motosouk ID front template">
      <div class="rider-id" id="idPreview">MTS-MG-0000</div>
      <div class="name" id="namePreview">RIDER NAME</div>
      <div class="workplace" id="workplacePreview">Assigned to: M-Gas</div>
    </div>

    <div class="id-card" id="backID">
      <img src="Horizontal ID Updated Back with QR.jpg" class="bg" alt="Motosouk ID back template">
    </div>
  </div>
</div>

<script>
const WEEKLY_LIMIT = 15;
let currentRiderCounted = false;
let lastKnownUsage = { used_count: 0, remaining_count: WEEKLY_LIMIT };

const supabaseUrl = window.__SUPABASE_CONFIG__?.url?.trim();
const supabaseKey = window.__SUPABASE_CONFIG__?.key?.trim();
const supabaseClient = supabaseUrl && supabaseKey
  ? window.supabase.createClient(supabaseUrl, supabaseKey)
  : null;

function setDownloadButtonsDisabled(disabled) {
  document.querySelectorAll('.download-button').forEach(button => {
    button.disabled = disabled;
  });
}

function setLimitDisplay(used, remaining) {
  lastKnownUsage = { used_count: used, remaining_count: remaining };
  document.getElementById('usedCount').textContent = used;
  document.getElementById('remainingCount').textContent = remaining;
  document.getElementById('limitBox').classList.toggle('limit-reached', remaining === 0);
  setDownloadButtonsDisabled(remaining === 0 && !currentRiderCounted);
}

function setMessage(text, type = '') {
  const element = document.getElementById('message');
  element.textContent = text;
  element.className = `message ${type}`.trim();
}

async function updateLimitDisplay() {
  if (!supabaseClient) {
    setLimitDisplay(0, 0);
    setMessage('Supabase is not configured. Add SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY in Vercel.', 'error');
    return false;
  }

  try {
    const { data, error } = await supabaseClient.rpc('get_weekly_id_usage');
    if (error) throw error;

    const usage = Array.isArray(data) ? data[0] : data;
    const used = Number(usage?.used_count ?? 0);
    const remaining = Number(usage?.remaining_count ?? Math.max(0, WEEKLY_LIMIT - used));
    setLimitDisplay(used, remaining);
    return true;
  } catch (error) {
    console.error('Could not load weekly usage:', error);
    setDownloadButtonsDisabled(true);
    setMessage('Could not verify the weekly ID allowance. Downloads are disabled until Supabase is reachable.', 'error');
    return false;
  }
}

function getClientDetails() {
  const code = document.getElementById('clientSelect').value;
  return code === 'EG'
    ? { code: 'EG', name: 'EasyGas' }
    : { code: 'MG', name: 'M-Gas' };
}

function cleanRiderNumber(value) {
  return value.trim().replace(/[^a-zA-Z0-9-]/g, '').toUpperCase();
}

function updatePreview() {
  const client = getClientDetails();
  const number = cleanRiderNumber(document.getElementById('riderNumber').value) || '0000';
  const name = document.getElementById('riderName').value.trim() || 'RIDER NAME';

  document.getElementById('idPreview').textContent = `MTS-${client.code}-${number}`;
  document.getElementById('namePreview').textContent = name;
  document.getElementById('workplacePreview').textContent = `Assigned to: ${client.name}`;
}

function validateRider() {
  const name = document.getElementById('riderName').value.trim();
  const number = cleanRiderNumber(document.getElementById('riderNumber').value);
  if (!name || !number) {
    setMessage('Enter both the rider name and rider ID number before downloading.', 'error');
    return false;
  }
  return true;
}

async function registerCurrentRider() {
  if (currentRiderCounted) return true;

  if (!supabaseClient) {
    setMessage('Supabase is not configured, so this ID cannot be registered.', 'error');
    return false;
  }

  setDownloadButtonsDisabled(true);

  try {
    const { data, error } = await supabaseClient.rpc('claim_weekly_id_slot');
    if (error) throw error;

    const result = Array.isArray(data) ? data[0] : data;
    const allowed = Boolean(result?.allowed);
    const used = Number(result?.used_count ?? lastKnownUsage.used_count);
    const remaining = Number(result?.remaining_count ?? Math.max(0, WEEKLY_LIMIT - used));

    setLimitDisplay(used, remaining);

    if (!allowed) {
      setMessage('The global weekly limit of 15 rider IDs has been reached.', 'error');
      return false;
    }

    currentRiderCounted = true;
    setMessage(`Rider ID registered globally. ${remaining} ID(s) remain this week.`, 'success');
    return true;
  } catch (error) {
    console.error('Could not register rider ID:', error);
    setMessage('Could not register this ID with Supabase. Nothing was counted. Please try again.', 'error');
    await updateLimitDisplay();
    return false;
  }
}

function safeFilenamePart(value, fallback) {
  const cleaned = value.trim().replace(/[^a-zA-Z0-9_-]+/g, '_').replace(/^_+|_+$/g, '');
  return cleaned || fallback;
}

async function downloadPNG(id, side) {
  if (!validateRider() || !(await registerCurrentRider())) return;

  const name = safeFilenamePart(document.getElementById('riderName').value, 'Rider');
  const riderID = safeFilenamePart(document.getElementById('idPreview').textContent, 'ID');

  try {
    const canvas = await html2canvas(document.getElementById(id), {
      scale: 3,
      backgroundColor: '#ffffff',
      useCORS: true
    });
    const link = document.createElement('a');
    link.href = canvas.toDataURL('image/png', 1.0);
    link.download = `${name}_${riderID}_${side}.png`;
    document.body.appendChild(link);
    link.click();
    link.remove();
  } catch (error) {
    setMessage('The image could not be created. Please try again.', 'error');
    console.error(error);
  }
}

async function downloadPDF() {
  if (!validateRider() || !(await registerCurrentRider())) return;

  const { jsPDF } = window.jspdf;
  const name = safeFilenamePart(document.getElementById('riderName').value, 'Rider');
  const riderID = safeFilenamePart(document.getElementById('idPreview').textContent, 'ID');

  try {
    const front = await html2canvas(document.getElementById('frontID'), {
      scale: 3,
      backgroundColor: '#ffffff',
      useCORS: true
    });
    const back = await html2canvas(document.getElementById('backID'), {
      scale: 3,
      backgroundColor: '#ffffff',
      useCORS: true
    });

    const pdf = new jsPDF({ orientation: 'landscape', unit: 'mm', format: [85.6, 54] });
    pdf.addImage(front.toDataURL('image/png'), 'PNG', 0, 0, 85.6, 54);
    pdf.addPage();
    pdf.addImage(back.toDataURL('image/png'), 'PNG', 0, 0, 85.6, 54);
    pdf.save(`${name}_${riderID}_FullID.pdf`);
  } catch (error) {
    setMessage('The PDF could not be created. Please try again.', 'error');
    console.error(error);
  }
}

async function nextRider() {
  document.getElementById('riderName').value = '';
  document.getElementById('riderNumber').value = '';
  document.getElementById('clientSelect').selectedIndex = 0;
  currentRiderCounted = false;
  setMessage('');
  updatePreview();
  await updateLimitDisplay();
  document.getElementById('riderName').focus();
}

updatePreview();
updateLimitDisplay();
</script>
</body>
</html>
